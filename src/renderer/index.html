<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GameMotion</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' ws:; object-src 'none'"
    />
    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <header class="toolbar">
      <h1>GameMotion <span>settings</span></h1>
      <label>
        Camera
        <select id="camera-select"></select>
      </label>
      <label>
        Tracking quality
        <select id="pose-model">
          <option value="full" selected>Balanced</option>
          <option value="lite">Fast</option>
          <option value="heavy">Most accurate</option>
        </select>
      </label>
      <label>
        Run on
        <select id="delegate">
          <option value="auto" selected>Auto</option>
          <option value="GPU">Graphics card (GPU)</option>
          <option value="CPU">Processor (CPU)</option>
        </select>
      </label>
      <label>
        Tracking rate
        <select id="max-hz">
          <option value="0" selected>Every frame</option>
          <option value="30">30 per second</option>
          <option value="15">15 per second</option>
        </select>
      </label>
      <div class="checks">
        <label
          class="check"
          title="Stops the webcam slowing down in dim light while you play. Your camera setting is put back afterwards."
        >
          <input id="hold-fps" type="checkbox" checked /> Stay smooth in dim light
        </label>
        <label class="check" title="Brightens the camera picture you see when the room is dark.">
          <input id="brighten" type="checkbox" checked /> Brighten a dark picture
        </label>
        <label
          class="check"
          title="Shows your hand cursors, lean and crouch meters and detected gestures on the camera picture."
        >
          <input id="input-test" type="checkbox" checked /> Show motion overlay
        </label>
      </div>
      <button id="play" type="button" class="primary">Play</button>
      <button id="guided" type="button">Test my setup</button>
      <button id="toggle" type="button" class="primary">Start camera</button>
    </header>
    <section class="settings" aria-label="Players and app settings">
      <span class="settings-title">Players</span>
      <div id="player-names" class="player-names"></div>
      <label class="check"
        ><input id="start-fullscreen" type="checkbox" /> Open in full screen</label
      >
      <label class="check" title="GameMotion opens by itself when you log in">
        <input id="autostart" type="checkbox" /> Open when I log in
      </label>
      <button id="add-shortcuts" type="button" hidden>Add to desktop &amp; app menu</button>
      <span class="settings-hint">Esc: back to games · F11: full screen</span>
    </section>

    <main class="stage-wrap">
      <div id="game-root" hidden></div>
      <div id="stage" class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <canvas id="input-layer"></canvas>
        <section id="diagnostics" class="diagnostics" aria-live="polite">
          <dl>
            <dt>Status</dt>
            <dd id="d-status">Idle</dd>
            <dt>Camera</dt>
            <dd id="d-camera">-</dd>
            <dt>Camera FPS</dt>
            <dd id="d-camera-fps">-</dd>
            <dt>Tracking FPS</dt>
            <dd id="d-tracking-fps">-</dd>
            <dt>Inference</dt>
            <dd id="d-inference">-</dd>
            <dt>Latency</dt>
            <dd id="d-latency">-</dd>
            <dt>Execution</dt>
            <dd id="d-delegate">-</dd>
            <dt>Detected</dt>
            <dd id="d-detected">-</dd>
            <dt>Skipped</dt>
            <dd id="d-skipped">-</dd>
            <dt>Camera tuning</dt>
            <dd id="d-tuning">-</dd>
            <dt>Brightness</dt>
            <dd id="d-brightness">-</dd>
            <dt>Body in view</dt>
            <dd id="d-body">-</dd>
            <dt>Calibration</dt>
            <dd id="d-calibration">-</dd>
            <dt>Posture</dt>
            <dd id="d-posture">-</dd>
          </dl>
          <p id="d-versions" class="versions"></p>
        </section>
        <div id="message" class="message" hidden></div>
      </div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
