appId: org.gamemotion.app
productName: GameMotion
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: gamemotion
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: GameMotion uses the camera for on-device motion tracking.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    # .deb needs a project homepage URL (package metadata); add one, then re-enable 'deb'.
    - AppImage
  syncDesktopName: true
  maintainer: GameMotion contributors
  category: Game
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
